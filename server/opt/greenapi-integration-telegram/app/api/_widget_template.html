<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://api.bitrix24.com/api/v1/"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter','Segoe UI',system-ui,sans-serif;padding:0;background:#f7f6f3;color:#2c2c2c;min-height:100vh;}
.container{max-width:100%;padding:12px;}
.card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid #e8e6e1;}
.header{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.logo{width:28px;height:28px;background:#1a1a2e;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700;}
.header h2{font-size:16px;font-weight:600;color:#1a1a2e;letter-spacing:-.02em;}
.label{display:block;font-size:11px;font-weight:500;color:#6b6b6b;margin-bottom:5px;letter-spacing:.02em;text-transform:uppercase;}
.input,.select,.textarea{width:100%;padding:9px 11px;border:1px solid #ddd;border-radius:8px;font-size:13px;font-family:inherit;background:#fafafa;color:#2c2c2c;transition:border-color .15s;outline:none;}
.input:focus,.select:focus,.textarea:focus{border-color:#1a1a2e;background:#fff;}
.textarea{min-height:60px;resize:vertical;line-height:1.5;}
.textarea-wrap{position:relative;}
.char-counter{margin-top:4px;text-align:right;font-size:10px;color:#999;}
.char-counter.warn{color:#b7791f;font-weight:600;}
.field.single-account{display:none;}
.field{margin-bottom:12px;}
.checks{display:flex;gap:14px;margin-bottom:12px;flex-wrap:wrap;}
.check-item{display:flex;align-items:center;gap:5px;font-size:12px;color:#555;cursor:pointer;}
.check-item input{width:15px;height:15px;accent-color:#1a1a2e;cursor:pointer;}
.btn{width:100%;padding:10px;border:none;border-radius:8px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .15s;}
.btn-primary{background:#1a1a2e;color:#fff;}
.btn-primary:hover{background:#2a2a3e;}
.btn-primary:disabled{background:#c0c0c0;cursor:not-allowed;}
.btn.loading{position:relative;color:transparent!important;}
.btn.loading:after{content:"";position:absolute;left:50%;top:50%;width:15px;height:15px;margin:-8px 0 0 -8px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.status{margin-top:10px;padding:8px 10px;border-radius:8px;font-size:12px;display:none;}
.status-ok{background:#e8f5e9;color:#2e7d32;display:block;}
.status-err{background:#fbe9e7;color:#c62828;display:block;}
.divider{height:1px;background:#eee;margin:14px 0;}
.tabs{display:flex;gap:0;margin-bottom:12px;border-bottom:2px solid #eee;}
.tab{padding:8px 14px;font-size:12px;font-weight:500;color:#999;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;}
.tab.active{color:#1a1a2e;border-bottom-color:#1a1a2e;font-weight:600;}
.tab:hover{color:#555;}
.tab-content{display:none;}
.tab-content.active{display:block;}
.history-wrap{position:relative;margin-bottom:12px;}
.history{max-height:250px;overflow-y:auto;padding:8px;background:#fafafa;border-radius:8px;}
.msg{margin-bottom:8px;display:flex;flex-direction:column;}
.msg.out{align-items:flex-end;}
.msg.in{align-items:flex-start;}
.msg-bubble{position:relative;max-width:80%;padding:8px 12px;border-radius:10px;font-size:12px;line-height:1.4;word-break:break-word;}
.msg.out .msg-bubble{background:#1a1a2e;color:#fff;border-bottom-right-radius:3px;}
.msg.in .msg-bubble{background:#e8e6e1;color:#2c2c2c;border-bottom-left-radius:3px;}
.copy-msg{display:none;position:absolute;top:-8px;right:6px;width:auto;padding:2px 6px;border:1px solid rgba(0,0,0,.08);border-radius:5px;background:#fff;color:#333;font-size:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);}
.msg-bubble:hover .copy-msg{display:block;}
.msg-files{display:flex;flex-direction:column;gap:5px;margin-top:6px;}
.msg-file{display:flex;align-items:center;gap:6px;font-size:11px;color:inherit;text-decoration:none;border:1px solid rgba(120,120,120,.25);border-radius:6px;padding:5px 6px;background:rgba(255,255,255,.14);}
.msg-file img{width:120px;max-width:100%;height:auto;border-radius:6px;display:block;}
.media-kind{display:inline-flex;margin-bottom:4px;padding:2px 6px;border-radius:5px;background:rgba(255,255,255,.35);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
.msg-time{font-size:10px;color:#999;margin-top:2px;}
.scroll-bottom{display:none;position:absolute;right:8px;bottom:8px;width:32px;height:32px;border:0;border-radius:50%;background:#1a1a2e;color:#fff;font-size:17px;box-shadow:0 3px 12px rgba(0,0,0,.22);cursor:pointer;}
.scroll-bottom.show{display:block;}
.status-mark{margin-left:4px;font-size:10px;opacity:.78;}
.typing{display:none;color:#777;font-size:11px;padding:3px 6px;margin-bottom:6px;}
.typing.show{display:block;}
.typing span{display:inline-block;width:4px;height:4px;margin-left:3px;border-radius:50%;background:#999;animation:blink 1s infinite;}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.empty{color:#999;font-size:12px;font-style:italic;text-align:center;padding:16px;}
.info-bar{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:10px;color:#999;}
.info-bar a{color:#1a1a2e;text-decoration:none;font-weight:500;}
.account-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:16px;font-size:11px;background:#eef0f2;color:#555;margin:2px;}
.account-chip .dot{width:5px;height:5px;border-radius:50%;background:#4caf50;}
.accounts-section{margin-bottom:12px;}
.file-list{font-size:11px;color:#777;margin-top:5px;line-height:1.4;}
.quick-replies{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;}
.quick-reply{width:auto;padding:6px 8px;border:1px solid #ddd;border-radius:7px;background:#fff;color:#333;font-size:11px;font-weight:500;cursor:pointer;}
.quick-reply:hover{border-color:#1a1a2e;}
.skeleton{display:grid;gap:8px;padding:4px;}
.skeleton-line{height:36px;border-radius:9px;background:linear-gradient(90deg,#eee,#f7f7f7,#eee);background-size:200% 100%;animation:shimmer 1.1s linear infinite;}
.skeleton-line.short{width:68%;}
@keyframes shimmer{to{background-position:-200% 0;}}
.lightbox{position:fixed;inset:0;background:rgba(20,20,25,.72);z-index:50;display:none;align-items:center;justify-content:center;padding:18px;}
.lightbox.open{display:flex;}
.lightbox-card{max-width:96vw;max-height:92vh;background:#111;border-radius:10px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.35);}
.lightbox-head{display:flex;justify-content:space-between;gap:12px;align-items:center;color:#fff;font-size:12px;padding:9px 11px;background:#1d1d24;}
.lightbox img{display:block;max-width:96vw;max-height:82vh;width:auto;height:auto;}
.lightbox button{width:auto;padding:5px 9px;border-radius:6px;background:#fff;color:#111;}
</style>
</head>
<body>
<div class="container">
<div class="card">
  <div class="header"><div class="logo">ST</div><h2>SAFY Telegram</h2></div>

  <div class="accounts-section"><span class="label">Accounts</span>
    <div id="accList" class="empty">Loading...</div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="compose" onclick="switchTab('compose',this)">Compose</div>
    <div class="tab" data-tab="history" onclick="switchTab('history',this)">History</div>
  </div>

  <div id="tab-compose" class="tab-content active">
    <form id="msgForm" onsubmit="return false;">
      <div class="field" id="accountField"><span class="label">Account</span>
        <select id="selAccount" class="select"><option value="">Select account...</option></select>
      </div>
      <div class="field"><span class="label">Recipient (phone or @username)</span>
        <input id="inpRecipient" class="input" placeholder="+79991234567 or @username" type="text">
      </div>
      <div class="field"><span class="label">Message</span>
        <div class="textarea-wrap">
          <textarea id="inpText" class="textarea" maxlength="4096" placeholder="Type your message..."></textarea>
          <div id="charCounter" class="char-counter">0 / 4096</div>
        </div>
        <div id="quickRepliesCompose" class="quick-replies"></div>
      </div>
      <div class="field"><span class="label">Files</span>
        <input id="inpFiles" class="input" type="file" multiple onchange="showSelectedFiles()">
        <div id="fileList" class="file-list"></div>
      </div>
      <div class="checks">
        <label class="check-item"><input type="checkbox" id="chkOL" checked> Open Lines</label>
        <label class="check-item"><input type="checkbox" id="chkLead" checked> Create lead</label>
        <label class="check-item"><input type="checkbox" id="chkTL"> Timeline</label>
      </div>
      <button type="button" id="btnSend" class="btn btn-primary" onclick="sendMsg()">Send Message</button>
      <div id="statusBar" class="status"></div>
    </form>
  </div>

  <div id="tab-history" class="tab-content">
    <div class="field"><span class="label">Chat with</span>
      <select id="selChat" class="select" onchange="loadHistory()">
        <option value="">Select recipient...</option>
      </select>
    </div>
    <div class="history-wrap">
      <div id="historyBox" class="history">
        <div class="empty">Select a chat to view history</div>
      </div>
      <button type="button" id="scrollBottomBtn" class="scroll-bottom" onclick="scrollHistoryBottom()">↓</button>
    </div>
    <div id="typingBox" class="typing">Client is typing<span></span><span></span><span></span></div>
    <div class="field">
      <input id="inpReply" class="input" maxlength="4096" placeholder="Reply..." type="text" onkeydown="if(event.key==='Enter'){replyMsg();}">
      <div id="replyCharCounter" class="char-counter">0 / 4096</div>
      <div id="quickRepliesReply" class="quick-replies"></div>
    </div>
    <button type="button" id="btnReply" class="btn btn-primary" onclick="replyMsg()">Reply</button>
    <div id="replyStatus" class="status"></div>
  </div>

  <div class="divider"></div>
  <div class="info-bar"><span id="infoDomain"></span><span id="operatorInfo"></span>
    <a id="infoLink" href="" target="_blank">Settings</a>
  </div>
</div>
</div>
<div id="lightbox" class="lightbox" onclick="if(event.target.id==='lightbox')closeLightbox()">
  <div class="lightbox-card">
    <div class="lightbox-head"><span id="lightboxTitle"></span><button type="button" onclick="closeLightbox()">Close</button></div>
    <img id="lightboxImage" alt="">
  </div>
</div>

<script>
var DOMAIN=%%DOMAIN_JSON%%;
var APP_URL=%%APP_URL_JSON%%;
var ENTITY_TYPE=%%ENTITY_TYPE_JSON%%;
var ENTITY_ID=%%ENTITY_ID_JSON%%;
var WIDGET_TOKEN=%%WIDGET_TOKEN_JSON%%;
var CURRENT_OPERATOR={id:"",name:""};
var operatorPromise=null;
var lastHistoryMessageKey="";
var notifyAudioReady=false;
var quickReplies=[];
var baseTitle=document.title || "SAFY Telegram";
var unreadCount=0;

document.getElementById("infoDomain").textContent="Domain: "+DOMAIN;
document.getElementById("infoLink").href=APP_URL.replace(/\/+$/,"")+"/admin?domain="+encodeURIComponent(DOMAIN);

function setWidgetDomain(domain){
  if(domain)DOMAIN=String(domain).trim().toLowerCase();
  document.getElementById("infoDomain").textContent="Domain: "+(DOMAIN||"Bitrix24");
  document.getElementById("infoLink").href=APP_URL.replace(/\/+$/,"")+"/admin?domain="+encodeURIComponent(DOMAIN||"");
}
function endpointDomain(value){
  try{return value?new URL(String(value)).hostname:"";}catch(e){return "";}
}
function bitrixAuthSnapshot(){
  var auth={};
  try{if(typeof BX24!=="undefined" && BX24.getAuth)auth=BX24.getAuth()||{};}catch(e){auth={};}
  var domain=DOMAIN||auth.DOMAIN||auth.domain||"";
  try{if(!domain && typeof BX24!=="undefined" && BX24.getDomain)domain=BX24.getDomain()||"";}catch(e){}
  domain=domain||endpointDomain(auth.client_endpoint)||endpointDomain(auth.server_endpoint);
  var token=auth.AUTH_ID||auth.auth_id||auth.access_token||auth.ACCESS_TOKEN||"";
  return {auth:auth,domain:domain,token:token};
}
function initWidgetAuth(){
  if(WIDGET_TOKEN&&DOMAIN)return Promise.resolve(true);
  return new Promise(function(resolve){
    var done=false;
    function finish(ok){
      if(done)return;
      done=true;
      resolve(!!ok);
    }
    function bootstrap(){
      var snap=bitrixAuthSnapshot();
      if(snap.domain)setWidgetDomain(snap.domain);
      if(!snap.domain||!snap.token){
        document.getElementById("statusBar").className="status status-err";
        document.getElementById("statusBar").textContent="Bitrix authorization is not ready. Reopen the widget.";
        finish(false);
        return;
      }
      fetch("/api/widget/bootstrap",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({domain:snap.domain,auth:snap.auth,AUTH_ID:snap.token})})
        .then(function(r){return r.json().then(function(d){return {ok:r.ok,data:d};});})
        .then(function(res){
          if(res.ok&&res.data&&res.data.widget_token){
            WIDGET_TOKEN=res.data.widget_token;
            setWidgetDomain(res.data.domain||snap.domain);
            finish(true);
            return;
          }
          document.getElementById("statusBar").className="status status-err";
          document.getElementById("statusBar").textContent="Widget authorization failed.";
          finish(false);
        })
        .catch(function(e){
          document.getElementById("statusBar").className="status status-err";
          document.getElementById("statusBar").textContent="Widget authorization error: "+e.message;
          finish(false);
        });
    }
    try{
      if(typeof BX24!=="undefined"&&BX24.init)BX24.init(bootstrap);
      else bootstrap();
    }catch(e){bootstrap();}
    setTimeout(function(){
      if(!done){
        document.getElementById("statusBar").className="status status-err";
        document.getElementById("statusBar").textContent="Bitrix authorization timeout. Reopen the widget.";
        finish(false);
      }
    },5000);
  });
}

function bitrixUserName(user){
  if(!user)return "";
  var parts=[user.NAME,user.LAST_NAME].filter(Boolean).join(" ").trim();
  return parts || user.LOGIN || user.EMAIL || (user.ID ? "Bitrix user #"+user.ID : "");
}
function loadBitrixOperator(){
  if(operatorPromise)return operatorPromise;
  operatorPromise=new Promise(function(resolve){
    var done=false;
    function finish(){
      if(done)return;
      done=true;
      document.getElementById("operatorInfo").textContent=CURRENT_OPERATOR.name?("Operator: "+CURRENT_OPERATOR.name):"";
      resolve(CURRENT_OPERATOR);
    }
    if(typeof BX24==="undefined" || !BX24.callMethod){finish();return;}
    try{
      var call=function(){
        try{
          BX24.callMethod("user.current", {}, function(result){
            try{
              if(result && !result.error()){
                var user=result.data()||{};
                CURRENT_OPERATOR.id=String(user.ID||user.id||"");
                CURRENT_OPERATOR.name=bitrixUserName(user);
              }
            }catch(e){}
            finish();
          });
        }catch(e){finish();}
      };
      if(BX24.init){BX24.init(call);}else{call();}
      setTimeout(finish,2500);
    }catch(e){finish();}
  });
  return operatorPromise;
}

function escHtml(s){
  return s?String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;"):'';
}
function clearNode(node){while(node&&node.firstChild)node.removeChild(node.firstChild);}
function addOption(select,value,label){select.add(new Option(String(label||""),String(value||"")));}
function emptyNotice(text){
  var node=document.createElement("span");
  node.className="empty";
  node.textContent=text;
  return node;
}
function arg(value){return encodeURIComponent(String(value==null?"":value));}
function widgetFetch(url,opts){
  opts=opts||{};
  opts.headers=Object.assign({},opts.headers||{},{"X-SAFY-Widget-Token":WIDGET_TOKEN});
  return fetch(url,opts);
}
function skeleton(){
  return '<div class="skeleton"><div class="skeleton-line"></div><div class="skeleton-line short"></div><div class="skeleton-line"></div></div>';
}
function relTime(value){
  if(!value)return "";
  var ts=Date.parse(String(value).replace(" ","T")+"Z");
  if(!Number.isFinite(ts))return String(value).split(" ").pop()||"";
  var diff=Math.max(0,Math.floor((Date.now()-ts)/1000));
  if(diff<60)return "just now";
  if(diff<3600)return Math.floor(diff/60)+" min ago";
  if(diff<86400)return Math.floor(diff/3600)+" h ago";
  return Math.floor(diff/86400)+" d ago";
}
function statusMark(m){
  if(m.direction!=="outbound")return "";
  if(m.status==="sent")return '<span class="status-mark">✓✓</span>';
  if(m.status==="failed"||m.status==="no_link")return '<span class="status-mark">!</span>';
  return '<span class="status-mark">✓</span>';
}
function mediaKind(files,text){
  files=Array.isArray(files)?files:[];
  var names=files.map(function(f){return String(f.name||"").toLowerCase();}).join(" ");
  var types=files.map(function(f){return String(f.type||"").toLowerCase();}).join(" ");
  var source=(names+" "+types+" "+String(text||"").toLowerCase());
  if(source.indexOf("стикер")>=0 || source.indexOf("sticker")>=0)return "Sticker";
  if(source.indexOf("голосовое")>=0 || source.match(/\.(ogg|oga|opus|mp3|wav|m4a)(\s|$)/) || source.indexOf("audio/")>=0)return "Voice";
  if(source.indexOf("видео-сообщение")>=0 || source.indexOf("video_note")>=0)return "Video note";
  if(source.match(/\.(jpg|jpeg|png|gif|webp|bmp|heic)(\s|$)/) || source.indexOf("image/")>=0)return "Photo";
  if(source.match(/\.(mp4|mov|webm|mkv)(\s|$)/) || source.indexOf("video/")>=0)return "Video";
  if(files.length)return "File";
  return "";
}
function draftKey(recipient){return "safy_draft_"+DOMAIN+"_"+String(recipient||"").replace(/[^a-z0-9_@+.-]/gi,"_");}
function loadReplyDraft(recipient){
  document.getElementById("inpReply").value=localStorage.getItem(draftKey(recipient))||"";
  updateReplyCounter();
}
function saveReplyDraft(){
  var chat=selectedChat();
  var recipient=(chat&&chat.chat_key)||document.getElementById("selChat").value;
  updateReplyCounter();
  if(!recipient)return;
  var value=document.getElementById("inpReply").value;
  if(value)localStorage.setItem(draftKey(recipient),value);
  else localStorage.removeItem(draftKey(recipient));
}
function clearReplyDraft(recipient){if(recipient)localStorage.removeItem(draftKey(recipient));}
function setUnreadCount(value){
  unreadCount=Math.max(0,Number(value)||0);
  document.title=unreadCount?("("+unreadCount+") "+baseTitle):baseTitle;
}
function historyAtBottom(){
  var box=document.getElementById("historyBox");
  return box.scrollHeight-box.scrollTop-box.clientHeight<48;
}
function scrollHistoryBottom(){
  var box=document.getElementById("historyBox");
  box.scrollTop=box.scrollHeight;
  document.getElementById("scrollBottomBtn").classList.remove("show");
  setUnreadCount(0);
}
function setButtonLoading(btn, loading, label){
  if(!btn)return;
  if(loading){
    btn.dataset.label=btn.textContent;
    btn.disabled=true;
    btn.classList.add("loading");
  }else{
    btn.disabled=false;
    btn.classList.remove("loading");
    btn.textContent=label||btn.dataset.label||btn.textContent;
  }
}
function openLightbox(url,name){
  if(!url)return;
  document.getElementById("lightboxImage").src=url;
  document.getElementById("lightboxTitle").textContent=name||"Image";
  document.getElementById("lightbox").classList.add("open");
}
function closeLightbox(){
  document.getElementById("lightbox").classList.remove("open");
  document.getElementById("lightboxImage").src="";
}
function updateCharCounter(){
  var text=document.getElementById("inpText").value||"";
  var counter=document.getElementById("charCounter");
  counter.textContent=text.length+" / 4096";
  counter.classList.toggle("warn",text.length>3800);
}
function clearComposeRequestId(){delete document.getElementById("inpText").dataset.requestId;}
function clearReplyRequestId(){delete document.getElementById("inpReply").dataset.requestId;}
function markComposeChanged(){clearComposeRequestId();updateCharCounter();}
function markReplyChanged(){clearReplyRequestId();saveReplyDraft();}
function updateReplyCounter(){
  var text=document.getElementById("inpReply").value||"";
  var counter=document.getElementById("replyCharCounter");
  counter.textContent=text.length+" / 4096";
  counter.classList.toggle("warn",text.length>3800);
}
function playNotify(){
  if(!notifyAudioReady)return;
  try{
    var ctx=new (window.AudioContext||window.webkitAudioContext)();
    var osc=ctx.createOscillator();
    var gain=ctx.createGain();
    osc.frequency.value=660; gain.gain.value=.035;
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); setTimeout(function(){osc.stop();ctx.close();},120);
  }catch(e){}
}
document.addEventListener("click",function(){notifyAudioReady=true;},{once:true});

function switchTab(name, tabEl){
  document.querySelectorAll(".tab").forEach(function(t){t.classList.remove("active");});
  document.querySelectorAll(".tab-content").forEach(function(t){t.classList.remove("active");});
  (tabEl||document.querySelector('.tab[data-tab="'+name+'"]')).classList.add("active");
  document.getElementById("tab-"+name).classList.add("active");
  if(name==="history"){loadChats().then(function(){if(document.getElementById("selChat").value)loadHistory();});}
}

var accountsMap={};
async function loadAccounts(){
  var r=await widgetFetch("/api/widget/accounts?DOMAIN="+encodeURIComponent(DOMAIN));
  var accs=await r.json();
  var sel=document.getElementById("selAccount");
  var list=document.getElementById("accList");
  var accountField=document.getElementById("accountField");
  clearNode(sel);
  addOption(sel,"","Select account...");
  accountsMap={};
  accountField.classList.remove("single-account");
  clearNode(list);
  if(!accs.length){list.appendChild(emptyNotice("No connected accounts"));return;}
  accs.forEach(function(a){
    accountsMap[a.id]=a;
    var label=a.username||a.phone||("Account #"+a.id);
    addOption(sel,a.id,label);
    var chip=document.createElement("span");
    chip.className="account-chip";
    var dot=document.createElement("span");
    dot.className="dot";
    chip.appendChild(dot);
    chip.appendChild(document.createTextNode(a.username||a.phone||("Acc #"+a.id)));
    list.appendChild(chip);
  });
  if(accs.length===1){
    sel.value=String(accs[0].id);
    accountField.classList.add("single-account");
  }
}

async function loadQuickReplies(){
  try{
    var r=await widgetFetch("/api/widget/quick-replies?DOMAIN="+encodeURIComponent(DOMAIN));
    quickReplies=await r.json();
  }catch(e){quickReplies=[];}
  renderQuickReplies("quickRepliesCompose","inpText");
  renderQuickReplies("quickRepliesReply","inpReply");
}
function renderQuickReplies(targetId,inputId){
  var box=document.getElementById(targetId);
  if(!box)return;
  if(!quickReplies.length){box.innerHTML="";return;}
  box.innerHTML=quickReplies.map(function(x,idx){
    return '<button type="button" class="quick-reply" onclick="insertQuickReply('+idx+',\''+inputId+'\')">'+escHtml(x.title||("Reply "+(idx+1)))+'</button>';
  }).join("");
}
function insertQuickReply(idx,inputId){
  var item=quickReplies[idx];
  var input=document.getElementById(inputId);
  if(!item||!input)return;
  var text=item.text||"";
  input.value=input.value ? (input.value.replace(/\s+$/,"")+"\n"+text) : text;
  input.focus();
  if(inputId==="inpText")markComposeChanged();
  if(inputId==="inpReply")markReplyChanged();
}

var chatsData=[];
var historyLoading=false;
var historyPollInFlight=false;
var historyRecipient="";
function selectedChat(){
  var value=document.getElementById("selChat").value;
  return chatsData.find(function(c){return String(c.chat_key||c.recipient)===String(value);})||null;
}
function makeClientRequestId(){
  if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();
  return "req_"+Date.now()+"_"+Math.random().toString(16).slice(2);
}
async function loadChats(){
  var r=await widgetFetch("/api/widget/chats?DOMAIN="+encodeURIComponent(DOMAIN));
  chatsData=await r.json();
  var sel=document.getElementById("selChat");
  var current=sel.value;
  clearNode(sel);
  addOption(sel,"","Select recipient...");
  chatsData.forEach(function(c){
    var key=c.chat_key||c.recipient;
    var accountLabel=c.account_id&&accountsMap[c.account_id] ? (accountsMap[c.account_id].username||accountsMap[c.account_id].phone||("Account #"+c.account_id)) : (c.account_id?("Account #"+c.account_id):"");
    var label=String(c.recipient||"")+" ("+String(c.last_from||accountLabel||"")+")";
    if(accountLabel && label.indexOf(accountLabel)<0)label+=" · "+accountLabel;
    addOption(sel,key,label);
  });
  if(current && chatsData.some(function(c){return String(c.chat_key||c.recipient)===String(current);}))sel.value=current;
  if(!chatsData.length){document.getElementById("historyBox").innerHTML='<div class="empty">No chats yet</div>';}
}

async function loadHistory(){
  if(historyLoading)return;
  var chat=selectedChat();
  var chatKey=document.getElementById("selChat").value;
  var recipient=chat&&chat.recipient ? chat.recipient : chatKey;
  if(!recipient){return;}
  var box=document.getElementById("historyBox");
  var oldScrollHeight=box.scrollHeight;
  var oldScrollTop=box.scrollTop;
  var wasNearBottom=historyAtBottom();
  var historyKey=(chat&&chat.chat_key)||chatKey;
  if(historyKey!==historyRecipient){
    historyRecipient=historyKey;
    lastHistoryMessageKey="";
    delete box.dataset.loaded;
    loadReplyDraft(historyKey);
    setUnreadCount(0);
  }
  historyLoading=true;
  if(!box.dataset.loaded){box.innerHTML=skeleton();}
  try{
    var p=new URLSearchParams({recipient:recipient,DOMAIN:DOMAIN});
    if(chat&&chat.account_id)p.set("account_id",chat.account_id);
    if(chat&&chat.chat_link_id)p.set("chat_link_id",chat.chat_link_id);
    var r=await widgetFetch("/api/widget/history?"+p.toString());
    var msgs=await r.json();
    var wasLoaded=!!box.dataset.loaded;
    box.dataset.loaded="1";
    if(!msgs.length){box.innerHTML='<div class="empty">No messages yet</div>';return;}
    var newest=msgs[msgs.length-1]||{};
    var newestKey=String(newest.id||"")+"|"+String(newest.timestamp||"")+"|"+String(newest.direction||"");
    if(wasLoaded && newestKey && newestKey!==lastHistoryMessageKey && newest.direction==="inbound"){
      playNotify();
      if(!wasNearBottom || document.hidden){
        setUnreadCount(unreadCount+1);
        document.getElementById("scrollBottomBtn").classList.add("show");
      }
    }
    lastHistoryMessageKey=newestKey;
    var html="";
    msgs.forEach(function(m){
      var cls=m.direction==="outbound"?"out":"in";
      var time=relTime(m.timestamp);
      var text=escHtml(m.text||"");
      var kind=mediaKind(m.files,m.text);
      var kindLabel=kind?'<span class="media-kind">'+escHtml(kind)+'</span><br>':"";
      var files=renderFiles(m.files);
      var copy='<button type="button" class="copy-msg" onclick="copyMessageText(decodeURIComponent(\''+arg(m.text||"")+'\'));event.stopPropagation();">Copy</button>';
      html+='<div class="msg '+cls+'"><div class="msg-bubble">'+copy+kindLabel+(text||(!files?'<span style="opacity:.65">No text</span>':""))+files+statusMark(m)+'</div><div class="msg-time">'+escHtml(m.from_name)+(time?" "+time:"")+'</div></div>';
    });
    box.innerHTML=html;
    if(!wasLoaded || wasNearBottom){
      scrollHistoryBottom();
    }else{
      box.scrollTop=Math.max(0,oldScrollTop+(box.scrollHeight-oldScrollHeight));
      document.getElementById("scrollBottomBtn").classList.add("show");
    }
    loadTypingStatus(historyKey);
  }finally{
    historyLoading=false;
  }
}

async function loadTypingStatus(chatKey){
  var el=document.getElementById("typingBox");
  var chat=chatsData.find(function(c){return String(c.chat_key||c.recipient)===String(chatKey);})||{};
  var recipient=chat.recipient||chatKey;
  try{
    var p=new URLSearchParams({DOMAIN:DOMAIN,recipient:recipient});
    if(chat.bitrix_chat_id)p.set("bitrix_chat_id",chat.bitrix_chat_id);
    if(chat.account_id)p.set("account_id",chat.account_id);
    var r=await widgetFetch("/api/widget/typing?"+p.toString());
    var d=await r.json();
    el.classList.toggle("show",!!d.typing);
  }catch(e){
    el.classList.remove("show");
  }
}

function renderFiles(files){
  if(!Array.isArray(files)||!files.length)return "";
  return '<div class="msg-files">'+files.map(function(f){
    var name=escHtml(f.name||"file");
    var url=escHtml(f.url||"");
    var label=mediaKind([f],"")||"File";
    if(f.type==="image"&&url){
      return '<a class="msg-file" href="'+url+'" onclick="openLightbox(decodeURIComponent(\''+arg(f.url||"")+'\'),decodeURIComponent(\''+arg(f.name||"file")+'\'));return false;"><img src="'+url+'" alt="'+name+'"><span>'+label+': '+name+'</span></a>';
    }
    if(f.type==="image"){return '<span class="msg-file">Photo: '+name+'</span>';}
    if(url){return '<a class="msg-file" href="'+url+'" target="_blank">'+label+': '+name+'</a>';}
    return '<span class="msg-file">'+label+': '+name+'</span>';
  }).join("")+'</div>';
}

async function copyMessageText(text){
  try{
    await navigator.clipboard.writeText(text||"");
  }catch(e){}
}

function showSelectedFiles(){
  clearComposeRequestId();
  var files=Array.from(document.getElementById("inpFiles").files||[]);
  document.getElementById("fileList").textContent=files.map(function(f){return f.name;}).join(", ");
}

function resetFileInput(){
  var oldInput=document.getElementById("inpFiles");
  var nextInput=oldInput.cloneNode(false);
  nextInput.value="";
  nextInput.addEventListener("change",showSelectedFiles);
  oldInput.parentNode.replaceChild(nextInput,oldInput);
  showSelectedFiles();
}

function syncWidgetFlags(){
  var ol=document.getElementById("chkOL");
  var lead=document.getElementById("chkLead");
  if(!ol||!lead)return;
  lead.disabled=!ol.checked;
  if(!ol.checked)lead.checked=false;
}

function normalizeRecipient(value){
  var rec=String(value||"").trim();
  if(!rec)return "";
  rec=rec.replace(/^https?:\/\//i,"").replace(/^(www\.)?(t\.me|telegram\.me)\//i,"@");
  rec=rec.split("?")[0].split("#")[0].replace(/\/+$/,"").trim();
  if(rec[0]==="@"){
    rec="@"+rec.slice(1).replace(/\s+/g,"");
  }else if(rec[0]==="+"){
    rec="+"+rec.slice(1).replace(/[\s().-]+/g,"");
  }else if(/^[A-Za-z0-9_ ]+$/.test(rec)){
    rec="@"+rec.replace(/\s+/g,"");
  }
  return rec;
}

function fileToPayload(file){
  return new Promise(function(resolve,reject){
    if(file.size>25*1024*1024){reject(new Error(file.name+" is too large"));return;}
    var reader=new FileReader();
    reader.onload=function(){
      var data=String(reader.result||"");
      resolve({name:file.name,type:file.type||"",content_type:file.type||"",data_base64:data.split(",").pop()});
    };
    reader.onerror=function(){reject(new Error("Could not read "+file.name));};
    reader.readAsDataURL(file);
  });
}

async function selectedFilePayloads(){
  var files=Array.from(document.getElementById("inpFiles").files||[]).slice(0,5);
  return Promise.all(files.map(fileToPayload));
}

var pollTimer=null;
async function sendMsg(){
  var acc=document.getElementById("selAccount").value;
  var rec=normalizeRecipient(document.getElementById("inpRecipient").value);
  document.getElementById("inpRecipient").value=rec;
  var txt=document.getElementById("inpText").value.trim();
  var ol=document.getElementById("chkOL").checked;
  var lead=document.getElementById("chkLead").checked;
  var tl=document.getElementById("chkTL").checked;
  var bar=document.getElementById("statusBar");
  var btn=document.getElementById("btnSend");
  var filePayloads=[];
  try{filePayloads=await selectedFilePayloads();}
  catch(e){bar.className="status status-err";bar.textContent=e.message;return;}
  if(!acc||!rec||(!txt&&!filePayloads.length)){bar.className="status status-err";bar.textContent="Fill recipient and message or files";return;}
  var operator=await loadBitrixOperator();
  var reqId=document.getElementById("inpText").dataset.requestId||makeClientRequestId();
  document.getElementById("inpText").dataset.requestId=reqId;
  setButtonLoading(btn,true);
  try{
    var r=await widgetFetch("/api/widget/send",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({account_id:parseInt(acc),recipient:rec,text:txt,
        files:filePayloads,create_ol_chat:ol,create_lead:lead,add_to_timeline:tl,
        entity_type:ENTITY_TYPE,entity_id:ENTITY_ID,domain:DOMAIN,
        operator_id:operator.id,operator_name:operator.name,client_request_id:reqId})});
    var d=await r.json();
    if(d.success){
      var details=Array.isArray(d.log)?d.log.filter(function(x){return !String(x).startsWith("ol_result:");}).slice(-3).join(" | "):"";
      bar.className="status status-ok";bar.textContent="Message sent!"+(details?" "+details:"");
      document.getElementById("inpText").value="";delete document.getElementById("inpText").dataset.requestId;updateCharCounter();resetFileInput();loadChats();
    }
    else if(d.partial_success){
      bar.className="status status-err";bar.textContent=d.error||"Sent to Telegram, but Bitrix action failed";
      document.getElementById("inpText").value="";delete document.getElementById("inpText").dataset.requestId;updateCharCounter();resetFileInput();loadChats();
    }
    else{bar.className="status status-err";bar.textContent="Error: "+(d.error||"Failed");}
  }catch(e){bar.className="status status-err";bar.textContent="Network error: "+e.message;}
  setButtonLoading(btn,false,"Send Message");
}

async function replyMsg(){
  var chatKey=document.getElementById("selChat").value;
  var chat=selectedChat();
  var rec=chat&&chat.recipient ? chat.recipient : chatKey;
  var txt=document.getElementById("inpReply").value.trim();
  var replyStatus=document.getElementById("replyStatus");
  var btn=document.getElementById("btnReply");
  if(!rec||!txt)return;
  var selAcc=document.getElementById("selAccount");
  var acc=selAcc.value;
  if(chat&&chat.account_id){selAcc.value=String(chat.account_id);acc=selAcc.value;}
  if(!acc){
    replyStatus.className="status status-err";
    replyStatus.textContent="Select account first";
    return;
  }
  var operator=await loadBitrixOperator();
  var reqId=document.getElementById("inpReply").dataset.requestId||makeClientRequestId();
  document.getElementById("inpReply").dataset.requestId=reqId;
  setButtonLoading(btn,true);
  replyStatus.className="status";
  replyStatus.textContent="";
  try{
    var r=await widgetFetch("/api/widget/send",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({account_id:parseInt(acc),recipient:rec,text:txt,
        files:[],create_ol_chat:document.getElementById("chkOL").checked,
        create_lead:document.getElementById("chkLead").checked,
        add_to_timeline:document.getElementById("chkTL").checked,
        entity_type:ENTITY_TYPE,entity_id:ENTITY_ID,domain:DOMAIN,
        chat_link_id:chat&&chat.chat_link_id?chat.chat_link_id:null,
        operator_id:operator.id,operator_name:operator.name,client_request_id:reqId})});
    var d=await r.json();
    if(d.success){
      document.getElementById("inpReply").value="";
      delete document.getElementById("inpReply").dataset.requestId;
      updateReplyCounter();
      clearReplyDraft((chat&&chat.chat_key)||chatKey);
      replyStatus.className="status status-ok";
      replyStatus.textContent="Reply sent";
      await loadHistory();
      loadChats();
    }else if(d.partial_success){
      document.getElementById("inpReply").value="";
      delete document.getElementById("inpReply").dataset.requestId;
      updateReplyCounter();
      clearReplyDraft((chat&&chat.chat_key)||chatKey);
      replyStatus.className="status status-err";
      replyStatus.textContent=d.error||"Sent to Telegram, but Bitrix action failed";
      await loadHistory();
      loadChats();
    }else{
      replyStatus.className="status status-err";
      replyStatus.textContent="Error: "+(d.error||"Failed");
    }
  }catch(e){
    replyStatus.className="status status-err";
    replyStatus.textContent="Network error: "+e.message;
  }
  setButtonLoading(btn,false,"Reply");
}

initWidgetAuth().then(function(ok){
  if(!ok)return;
  loadAccounts();
  loadQuickReplies();
  loadBitrixOperator();
});
document.getElementById("inpText").addEventListener("input",markComposeChanged);
document.getElementById("inpReply").addEventListener("input",markReplyChanged);
document.getElementById("inpRecipient").addEventListener("input",clearComposeRequestId);
document.getElementById("selAccount").addEventListener("change",function(){clearComposeRequestId();clearReplyRequestId();});
document.getElementById("historyBox").addEventListener("scroll",function(){
  if(historyAtBottom()){
    document.getElementById("scrollBottomBtn").classList.remove("show");
    setUnreadCount(0);
  }
});
updateCharCounter();
updateReplyCounter();
document.getElementById("chkOL").addEventListener("change",function(){clearComposeRequestId();clearReplyRequestId();syncWidgetFlags();});
document.getElementById("chkLead").addEventListener("change",function(){clearComposeRequestId();clearReplyRequestId();});
document.getElementById("chkTL").addEventListener("change",function(){clearComposeRequestId();clearReplyRequestId();});
syncWidgetFlags();
document.addEventListener("keydown",function(ev){if(ev.key==="Escape")closeLightbox();});
setInterval(async function(){
  if(historyPollInFlight)return;
  if(!document.getElementById("tab-history").classList.contains("active"))return;
  historyPollInFlight=true;
  try{await loadHistory();}finally{historyPollInFlight=false;}
},5000);
</script>
