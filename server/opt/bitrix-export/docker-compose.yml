services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bitrix_export}
      POSTGRES_USER: ${POSTGRES_USER:-bitrix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-REPLACE_WITH_PRIVATE_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bitrix} -d ${POSTGRES_DB:-bitrix_export}"]
      interval: 5s
      timeout: 5s
      retries: 20

  sync:
    build: ./sync
    restart: "no"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./sync:/app

  trino:
    image: trinodb/trino:448
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog

volumes:
  postgres_data: