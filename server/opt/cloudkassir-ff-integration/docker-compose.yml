services:
  app:
    build: .
    image: cloudkassir-ff-integration:latest
    container_name: cloudkassir-ff-app
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3100
      DATABASE_URL: REPLACE_WITH_PRIVATE_DATABASE_URL
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:3100:3100"
    command: npm run start
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    image: cloudkassir-ff-integration:latest
    container_name: cloudkassir-ff-worker
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: REPLACE_WITH_PRIVATE_DATABASE_URL
    volumes:
      - ./data:/app/data
    command: npm run worker:prod
